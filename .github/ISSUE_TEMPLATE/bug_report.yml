name: Bug report
description: Report a reproducible X Post Cleaner problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never submit cookies, tokens, passwords, credentials, or private account data."
  - type: input
    id: version
    attributes: { label: Script version, placeholder: "1.0.0" }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and version, placeholder: "Chrome 140" }
    validations: { required: true }
  - type: input
    id: language
    attributes: { label: X UI language, placeholder: "English" }
    validations: { required: true }
  - type: dropdown
    id: dry_run
    attributes:
      label: Was DRY_RUN enabled?
      options: ["Yes", "No"]
    validations: { required: true }
  - type: textarea
    id: error
    attributes: { label: Console error and safe reproduction steps }
    validations: { required: true }
